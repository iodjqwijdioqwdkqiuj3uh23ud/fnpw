<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 소원 나무</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #1e3799, #0c2461); color: white; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 90%; max-width: 500px; padding: 40px 0; }
        .input-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.2); margin-bottom: 30px; }
        textarea { width: 100%; height: 100px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px; padding: 15px; color: white; font-size: 16px; outline: none; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; margin-top: 15px; background: #4bc0c0; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #36a2eb; }
        .wish-card { background: rgba(255, 255, 255, 0.05); border-radius: 15px; padding: 20px; margin-bottom: 15px; border-left: 5px solid #4bc0c0; }
        .wish-date { font-size: 12px; opacity: 0.6; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center;">🌟 소원 나무</h1>
        <div class="input-card">
            <textarea id="wishInput" placeholder="당신의 소원을 적어주세요..."></textarea>
            <button class="btn" onclick="sendWish()">소원 띄우기</button>
        </div>
        <div id="wishList"></div>
    </div>

    <script>
        async function loadWishes() {
            const res = await fetch('/api/wishes');
            const wishes = await res.json();
            const list = document.getElementById('wishList');
            list.innerHTML = wishes.map(w => `
                <div class="wish-card">
                    <div>${w.content}</div>
                    <div class="wish-date">✨ ${w.date}</div>
                </div>
            `).join('');
        }

        async function sendWish() {
            const content = document.getElementById('wishInput').value;
            if(!content) return alert('소원을 입력해줘!');

            await fetch('/api/wishes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });

            document.getElementById('wishInput').value = '';
            loadWishes(); // 등록 후 바로 목록 새로고침
        }

        loadWishes(); // 처음에 목록 불러오기
        setInterval(loadWishes, 5000); // 5초마다 자동으로 새 소원 업데이트
    </script>
</body>
</html>
