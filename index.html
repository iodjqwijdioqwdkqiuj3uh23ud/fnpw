<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Whispering Stars | 소원 나무</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--primary-gradient);
            background-attachment: fixed;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 0;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5rem;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        /* 유리 효과 입력창 */
        .input-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: white;
            color: #764ba2;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* 소원 아이템 디자인 */
        .wish-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #fff;
            animation: fadeInUp 0.8s ease;
        }

        .wish-content {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .wish-meta {
            font-size: 0.85rem;
            opacity: 0.7;
            display: flex;
            justify-content: space-between;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="animate__animated animate__fadeInDown">
            <h1>🌟 Whispering Stars</h1>
            <p>2026년, 당신의 소중한 소원을 밤하늘에 띄워보세요.</p>
        </header>

        <section class="input-card">
            <textarea id="wishInput" placeholder="이곳에 소원을 적으면 별이 되어 빛납니다..."></textarea>
            <button class="submit-btn" onclick="postWish()">소원 띄우기</button>
        </section>

        <div id="wishList">
            </div>
    </div>

    <script>
        async function loadWishes() {
            const res = await fetch('/api/wishes');
            const wishes = await res.json();
            const list = document.getElementById('wishList');
            list.innerHTML = wishes.map((w, index) => `
                <div class="wish-card" style="animation-delay: ${index * 0.1}s">
                    <div class="wish-content">${w.content}</div>
                    <div class="wish-meta">
                        <span>✨ 누군가의 소원</span>
                        <span>${w.date}</span>
                    </div>
                </div>
            `).join('');
        }

        async function postWish() {
            const content = document.getElementById('wishInput').value;
            if(!content) return alert('소원을 입력해주세요!');

            await fetch('/api/wishes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });

            document.getElementById('wishInput').value = '';
            loadWishes();
        }

        loadWishes();
    </script>
</body>
</html>
